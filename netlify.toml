[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  # These env vars appear as display values (phone, email) in public UI files
  # and in the seed script — Netlify's scanner is expected to flag them.
  SECRETS_SCAN_OMIT_KEYS = "ADMIN_EMAIL,ADMIN_PASSWORD,ADMIN_WHATSAPP_PHONE"
